<h2>{{dispositivo.marca}} {{dispositivo.modello}}</h2>
<p>Inventario: {{dispositivo.inventario}}</p>
<p>Stato: {{dispositivo.stato}}</p>
<p><button [disabled]="dispositivo.stato == 'in prestito'">Chiedi in prestito</button></p>

<article class="scheda"
  [attr.data-inventario]="dispositivo.inventario"
  [attr.aria-label]="'Dispositivo ' + dispositivo.inventario"
  [class.in-prestito]="dispositivo.stato == 'in prestito'"
  [class.disponibile]="dispositivo.stato == 'disponibile'"
  [class.manutenzione]="dispositivo.stato == 'manutenzione'">

  Dettagli dell'articolo
</article>
